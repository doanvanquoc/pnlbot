name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/pnlbot
            git -c safe.directory=/home/ubuntu/pnlbot pull origin main
            sudo chown -R pnlbot:pnlbot /home/ubuntu/pnlbot
            sudo systemctl restart pnlbot
            sudo systemctl status pnlbot --no-pager