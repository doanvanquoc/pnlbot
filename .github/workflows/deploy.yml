name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /pnlbot
            git -c safe.directory=/pnlbot pull origin main
            chown -R pnlbot:pnlbot /pnlbot
            systemctl restart pnlbot
            systemctl status pnlbot --no-pager
